project:
  name: electricity
  root: /root/autodl-tmp/electricity
  mode: warn

paths:
  material_dir: eletricmaterial
  data_zip: eletricmaterial/to_sais_new.zip
  output_demo: eletricmaterial/output_demo.csv
  artifacts_dir: artifacts
  reports_dir: reports
  outputs_dir: outputs
  mlruns_dir: mlruns

data:
  train_feature: to_sais_new/train/mengxi_boundary_anon_filtered.csv
  train_label: to_sais_new/train/mengxi_node_price_selected.csv
  test_feature: to_sais_new/test/test_in_feature_ori.csv
  time_col: times
  target_col: A
  feature_cols:
    - 系统负荷预测值
    - 风光总加预测值
    - 联络线预测值
    - 风电预测值
    - 光伏预测值
    - 水电预测值
    - 非市场化机组预测值

feature_sets:
  bid_space: true
  business_features:
    - net_load
    - renewable_ratio
    - wind_ratio
    - solar_ratio
    - tie_line_ratio
    - non_market_ratio
  rank_features:
    - net_load_day_rank_pct
    - renewable_ratio_day_rank_pct
    - load_day_rank_pct
    - solar_day_rank_pct
    - wind_day_rank_pct
  nwp_residual: true

nwp:
  feature_csv: artifacts/features/nwp_grid_15min.csv

nwp_residual:
  columns:
    - nwp_wind_speed100_mean
    - nwp_wind_speed100_max
    - nwp_u100_mean
    - nwp_v100_mean
    - nwp_ghi_mean
    - nwp_ghi_max
    - nwp_tcc_mean
    - nwp_tcc_max
    - nwp_sp_mean

folds:
  - name: valid_2025_09
    train_end: "2025-08-31 23:59:59"
    valid_start: "2025-09-01 00:00:00"
    valid_end: "2025-09-30 23:59:59"
  - name: valid_2025_10
    train_end: "2025-09-30 23:59:59"
    valid_start: "2025-10-01 00:00:00"
    valid_end: "2025-10-31 23:59:59"
  - name: valid_2025_11
    train_end: "2025-10-31 23:59:59"
    valid_start: "2025-11-01 00:00:00"
    valid_end: "2025-11-30 23:59:59"
  - name: valid_2025_12
    train_end: "2025-11-30 23:59:59"
    valid_start: "2025-12-01 00:00:00"
    valid_end: "2025-12-31 23:59:59"
  - name: valid_2025_jan_feb
    train_start: "2025-03-01 00:00:00"
    train_end: "2025-12-31 23:59:59"
    valid_start: "2025-01-01 00:00:00"
    valid_end: "2025-02-28 23:59:59"

dispatch:
  charge_power: -1000
  discharge_power: 1000
  block_size: 8
  points_per_day: 96
  charge_start_min: 0
  charge_start_max: 80
  discharge_start_max: 88
  tau: 0.0
  tau_grid:
    start: 0.0
    stop: 20.0
    step: 0.5

model:
  name: lgb_pair_spread_bidspace_weather_resid_5fold
  target_mode: pair_spread
  train_window_days: 180
  pair_point_feature_cols:
    - bid_space
    - net_load
    - renewable_ratio
    - wind_ratio
    - solar_ratio
    - tie_line_ratio
    - non_market_ratio
    - net_load_day_rank_pct
    - renewable_ratio_day_rank_pct
    - nwp_wind_speed100_mean_mh_resid
    - nwp_wind_speed100_max_mh_resid
    - nwp_u100_mean_mh_resid
    - nwp_ghi_mean_mh_resid
    - nwp_tcc_mean_mh_resid
    - nwp_sp_mean_mh_resid
  pair_agg_stats:
    - mean
  params:
    objective: huber
    metric: l2
    learning_rate: 0.03
    num_leaves: 31
    feature_fraction: 0.85
    bagging_fraction: 0.85
    bagging_freq: 1
    min_data_in_leaf: 200
    lambda_l2: 2.0
    num_threads: 8
    force_col_wise: true
    deterministic: true
    seed: 2026
    verbosity: -1
  num_boost_round: 500
  early_stopping_rounds: 50
